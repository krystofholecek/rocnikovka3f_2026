name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.15"
      - run: ruff check .

  # Backend chatu (Django API)
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-not-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements/chat.txt
      - run: python manage.py check
      - run: pip install pytest && pytest -q chat

  # Data a model (llm2005/) + složení webu
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements/train.txt pytest
      - run: pytest -q llm2005
      - run: python scripts/build_site.py
