# Jen nastavení nástrojů (ruff, pytest). Projekt se neinstaluje jako balíček.

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["web/tokenizer-lab/node_modules", "dist"]

[tool.ruff.lint]
# Chyby (E4/E7/E9), nepoužité a nedefinované názvy (F) a pořadí importů (I).
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Vnořená funkce používá proměnné z obklopující funkce, které se později mažou (del) – falešné hlášení.
"llm2005/diagnose_train.py" = ["F821"]

[tool.pytest.ini_options]
testpaths = ["llm2005", "chat"]
